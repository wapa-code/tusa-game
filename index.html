h1{font-size:clamp(30px,4vw,48px);color:#0871d8;margin:0 0 5px}.prompt{width:100%;background:#fff5d9;border:4px solid #086dc8;border-radius:19px;padding:10px;font-size:25px;font-weight:900;color:#075eae;margin:8px 0 12px}
.animalFrame{width:min(100%,610px);height:315px;border:5px solid #0871d8;border-radius:25px;background:linear-gradient(#bcecff,#effaff);display:flex;align-items:center;justify-content:center;overflow:hidden}

.choices{display:flex;gap:22px;justify-content:center;width:100%}.choice{min-width:145px;background:#bde7ff;border:5px solid #0871d8;border-radius:20px;font-size:51px;font-weight:900;padding:10px 25px;cursor:pointer}

@media(max-width:800px){.board{grid-template-columns:130px 1fr;grid-template-rows:auto 1fr}.points{grid-column:2;grid-row:1;width:110px;justify-self:end}.content{grid-column:1/3;grid-row:2;padding-bottom:210px}.left{position:absolute;bottom:35px;left:25px}.board{position:relative}.tusa{width:225px;height:245px;object-fit:contain;object-position:center bottom;margin:-5px 0 0}.thought{width:80px;height:65px;font-size:42px}.animalFrame{height:250px}.animal{font-size:145px}.choices{gap:8px}.choice{min-width:90px;font-size:40px}.header{height:65px}}

<script>
(function(){
"use strict";
var bank=[
["🐱","qattus","q",["q","f","m"]],["🐶","kelb","k",["k","f","m"]],["🐴","żiemel","ż",["ż","z","ġ"]],
["🐝","naħla","n",["n","m","b"]],["🐄","baqra","b",["b","p","d"]],["🐑","nagħġa","n",["n","m","r"]],
["🐦","għasfur","għ",["għ","g","ġ"]],["🐯","tigra","t",["t","d","p"]],["🐘","iljunfant","i",["i","l","e"]],
["🐦","ċawla","ċ",["ċ","c","ġ"]],["🦅","ajkla","a",["a","e","o"]],["🐛","dudu","d",["d","t","b"]],
["🐸","żrinġ","ż",["ż","z","ġ"]],["🐐","mogħża","m",["m","n","b"]],["🦋","farfett","f",["f","v","t"]],
["🦒","ġiraffa","ġ",["ġ","g","ċ"]],["🐷","ħanżir","ħ",["ħ","h","għ"]],["🐰","fenek","f",["f","v","p"]],
["🫏","ħmar","ħ",["ħ","h","m"]],["🐻","ors","o",["o","a","u"]],["🐊","kukkudrill","k",["k","q","g"]],
["🐒","xadina","x",["x","ċ","s"]],["🐔","tiġieġa","t",["t","d","p"]],["🐝","żunżan","ż",["ż","z","ġ"]],
["🦎","gremxula","g",["g","ġ","k"]],["🦔","qanfud","q",["q","k","g"]]
];
var animalPics={'qattus':"assets/image_jpg_01.jpg",'kelb':"assets/image_jpg_02.jpg",'żiemel':"assets/image_jpg_03.jpg",'naħla':"assets/image_jpg_04.jpg",'baqra':"assets/image_jpg_05.jpg",'nagħġa':"assets/image_jpg_06.jpg",'ħanżir':"assets/image_jpg_07.jpg",'fenek':"assets/image_jpg_08.jpg",'tiġieġa':"assets/image_jpg_09.jpg"};
var imgs={winner:"assets/image_png_04.png",unsure:"assets/image_png_05.png",wrong:"assets/image_png_06.png",happy:"assets/image_png_07.png",pleased:"assets/image_png_08.png",'żrinġ':"assets/image_png_09.png"};
function E(x){return document.getElementById(x)} function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var qs=shuffle(bank).slice(0,10),i=0,score=0,first=true;
function render(){var q=qs[i];first=true;if(animalPics[q[1]]){E("animal").src=animalPics[q[1]];E("animal").alt=q[1]}else{E("animal").src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent("<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"600\" height=\"315\"><rect width=\"100%\" height=\"100%\" fill=\"white\"/><text x=\"50%\" y=\"62%\" text-anchor=\"middle\" font-size=\"180\">"+q[0]+"</text></svg>");E("animal").alt=q[1]};E("blank").innerHTML="&nbsp;";E("rest").textContent=q[1].substring(q[2].length);E("feedback").textContent="";E("next").style.display="none";E("tusa").src=imgs.unsure;E("thought").textContent="?";E("thought").className="thought";E("progress").textContent=(i+1)+" / 10";var a=E("choices");a.innerHTML="";shuffle(q[3]).forEach(function(l){var b=document.createElement("button");b.className="choice";b.type="button";b.textContent=l;b.onclick=function(){check(l,b)};a.appendChild(b)})}
function check(l,b){var q=qs[i];E("blank").textContent=l;if(l===q[2]){if(first){score++;E("score").textContent=score}E("feedback").textContent="";E("tusa").src=imgs.happy;E("thought").textContent="Prosit! ⭐";E("thought").className="thought prosit";Array.prototype.forEach.call(E("choices").children,function(x){x.disabled=true});E("next").style.display="inline-block"}else{first=false;b.disabled=true;E("feedback").textContent="";E("tusa").src=imgs.wrong;E("thought").textContent="Erġa' pprova!";E("thought").className="thought retry"}}
E("next").onclick=function(){i++;if(i<10)render();else finish()};
function finish(){
  E("progress").textContent="10 / 10";
  E("score").textContent=score;
  E("tusa").style.visibility="visible";
  E("tusa").src=imgs.pleased;
  E("thought").textContent="Prosit! ⭐";
  E("thought").className="thought prosit";
  E("content").innerHTML=
    '<div class="win2">'+
      '<img class="win2Run" src="'+imgs.winner+'" alt="Tusa tiċċelebra">'+
      '<div class="win2Prosit">Prosit!</div>'+
      '<div class="win2Done">Għamiltha kollha!</div>'+
      '<div class="win2Star">⭐</div>'+
    '</div>';
  var next=E("next");
  if(next){next.style.display="block";next.textContent="Erġa’ ibda ↻";next.onclick=function(){location.reload();};}
}
render();
})();
</script></body></html>

#musicBtn{

<script>
(function(){
 var music=document.getElementById("bgMusic"), btn=document.getElementById("musicBtn");
 music.volume=0.32;
 function startMusic(){
   music.play().then(function(){btn.classList.remove("off");})
   .catch(function(){btn.classList.add("off");});
 }
 // Browsers normally require the child's first click/tap before audio may start.
 document.addEventListener("pointerdown",function first(){
   startMusic(); document.removeEventListener("pointerdown",first);
 },{once:true});
 btn.addEventListener("click",function(e){
   e.stopPropagation();
   if(music.paused){startMusic();}else{music.pause();btn.classList.add("off");}
 });
})();
</script>
